name: CE2 Regression Checks
on:
  push:
    branches: [main, 'fix/**']
  pull_request:
    branches: [main]
jobs:
  data-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check game.js
          node --check challenge.js
          node --check data.js
          node --check challenge-data.js
          node --check sw.js
          node --check scroll-guides.js
      - name: Run regression tests
        run: |
          node tests/audit-regression.test.cjs
          node tests/gameplay.test.cjs
          node tests/profiles.test.cjs
