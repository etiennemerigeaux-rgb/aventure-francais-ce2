name: CE2 Regression Checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  data-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check game.js
          node --check challenge.js
          node --check data.js
          node --check scripts/build-exam-bank.cjs
          node --check challenge-data.js
          node --check sw.js
          node --check scroll-guides.js
      - name: Run regression tests
        run: |
          node tests/audit-regression.test.cjs
          node tests/gameplay.test.cjs
          node tests/profiles.test.cjs
          node tests/rewards.test.cjs
          node tests/navigation-arrows.test.cjs
          node tests/pedagogy.test.cjs
          node tests/question-diversity.test.cjs
  mobile-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium for browser smoke tests
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve application and test mobile paths
        run: |
          python3 -m http.server 4173 >/tmp/ce2-server.log 2>&1 &
          node tests/browser-smoke.cjs
          node tests/browser-arrows.cjs
          node tests/browser-learning-variety.cjs
