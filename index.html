'use strict';var DATA={"worlds":[{"icon":"🌳","name":"Forêt de la ponctuation","intro":"Retrouve les signes magiques !","questions":[{"q":"Quel signe termine une question ?","options":["?",".","!",":"],"answer":0,"explanation":"Une question demande quelque chose. Par exemple : Où est mon livre ? Regarde le signe à la fin : c'est le point d'interrogation. Astuce : quand tu poses une question, pense au point d'interrogation."},{"q":"« Quelle belle surprise » se termine par…","options":["!","?",",",";"],"answer":0,"explanation":"On s'étonne : Quelle belle surprise ! On entend une émotion dans la voix. Le point d'exclamation montre la surprise, la joie ou un avertissement."},{"q":"« Le chat dort » se termine par…","options":["?",":",".","!"],"answer":2,"explanation":"Le chat dort. On raconte simplement quelque chose. On ne pose pas de question et on ne crie pas. On termine donc avec un point."},{"q":"Dans « J’achète des pommes, des poires et des bananes », quel signe sépare les éléments ?","options":["!","?",",",";"],"answer":2,"explanation":"Dans une liste, on fait une petite pause entre les éléments. J'achète des pommes, des poires et des bananes. Les virgules séparent les fruits."},{"q":"Quel signe annonce une liste ?","options":[":","!","?","."],"answer":0,"explanation":"Écoute : Dans mon sac, il y a : un livre, une trousse et un cahier. Les deux-points annoncent ce qu'on va énumérer. C'est une astuce pour reconnaître une liste."},{"q":"« Je voulais te dire… » : les trois points indiquent…","options":["Une phrase inachevée","Une question","Un ordre","Une liste terminée"],"answer":0,"explanation":"Je voulais te dire… mais je m'arrête avant de finir. Les trois petits points montrent que la phrase reste en suspens. On les appelle points de suspension."},{"q":"Complète : « Où vas-tu__ »","options":[".","?","!",":"],"answer":1,"explanation":"Où vas-tu ? C'est une question. Pour choisir le signe, demande-toi : est-ce qu'on attend une réponse ? Si oui, mets un point d'interrogation."},{"q":"Complète : « Attention__ »","options":["?","!",":","."],"answer":1,"explanation":"Attention ! On prévient quelqu'un d'un danger. Le point d'exclamation montre qu'on parle avec force. On peut aussi l'utiliser pour la joie ou la surprise."},{"q":"Complète : « Je prends trois crayons__ un rouge, un bleu et un vert. »","options":[":","?","!","."],"answer":0,"explanation":"On annonce une liste de crayons. Les deux-points servent à présenter cette liste."},{"q":"Complète : « Chut__ Le bébé dort. »","options":["!","?",",","."],"answer":0,"explanation":"On demande de faire silence avec insistance. Le point d’exclamation montre cette émotion."}]},{"icon":"🦁","name":"Théâtre des animaux","intro":"Fais parler les personnages !","questions":[{"q":"Quel signe peut ouvrir un dialogue ?","options":["?","«",":","."],"answer":1,"explanation":"Quand plusieurs personnages parlent, on peut mettre des guillemets pour montrer le début et la fin de leurs paroles. Les guillemets qui s'ouvrent sont comme une porte qui s'ouvre."},{"q":"Quel signe peut fermer un dialogue ?","options":["»","—","«","!"],"answer":0,"explanation":"Les guillemets fermants montrent que les paroles sont terminées. Imagine une porte : on l'ouvre avant de parler et on la referme après."},{"q":"Quel signe annonce un changement de personnage ?","options":["…",",","—","?"],"answer":2,"explanation":"Quand un autre personnage prend la parole, on commence souvent une nouvelle ligne avec un tiret. Le tiret aide à voir qui parle à son tour."},{"q":"Dans « Où vas-tu ? demande Léo. », quel est le verbe de dialogue ?","options":["vas","Léo","demande","vite"],"answer":2,"explanation":"Écoute : Où vas-tu ? demande Léo. Le mot demande nous dit comment Léo parle. C'est un verbe de dialogue. Cherche le mot qui accompagne les paroles."},{"q":"Quel signe convient à « Tu viens avec moi__ »","options":[".","?",":",","],"answer":1,"explanation":"Tu viens avec moi ? La personne pose une question. Même dans un dialogue, un ["Dans le passé","Dans le présent","Dans le futur","Dans un livre"],"answer":1,"explanation":"Maintenant, je lis. Maintenant, c'est au moment où je parle. L'action se déroule au présent."},{"q":"Quel mot indique le passé ?","options":["Autrefois","Bientôt","Actuellement","Doucement"],"answer":0,"explanation":"Autrefois signifie il y a longtemps. On parle de quelque chose qui s'est passé avant aujourd'hui : c'est le passé."},{"q":"Quel mot indique le futur ?","options":["En ce moment","Hier","Plus tard","Tout à coup"],"answer":2,"explanation":"Plus tard veut dire après maintenant. Ce n'est pas encore arrivé. On parle donc du futur."},{"q":"« La semaine dernière, nous avons chanté. »","options":["Futur","Passé","Présent","Demain"],"answer":1,"explanation":"La semaine dernière est terminée. Nous avons chanté à ce moment-là. Comme c'était avant aujourd'hui, c'est le passé."},{"q":"« Aujourd’hui, je suis en CE2. »","options":["Passé","Présent","Futur","Toujours"],"answer":1,"explanation":"Aujourd'hui, je suis en CE2. Aujourd'hui, c'est le jour où nous sommes. La phrase parle du présent."},{"q":"« L’an prochain, tu seras en CM1. »","options":["Présent","Futur","Passé","Hier"],"answer":1,"explanation":"L'an prochain veut dire l'année prochaine. Elle n'est pas encore arrivée. C'est donc le futur."},{"q":"« Dans deux jours, nous visiterons le musée. » Quand ?","options":["Dans le futur","Dans le passé","Dans le présent","À midi"],"answer":0,"explanation":"Dans deux jours, ce n’est pas encore arrivé. L’action est donc dans le futur."},{"q":"« En ce moment, Nina écrit. » Quand ?","options":["Dans le passé","Dans le présent","Dans le futur","Bientôt"],"answer":1,"explanation":"En ce moment veut dire maintenant. L’action se passe dans le présent."}]},{"icon":"🔎","name":"Détective des verbes","intro":"Repère les mots qui changent !","questions":[{"q":"Dans « Le chat dort. », quel est le verbe ?","options":["chat","dort","le","dormir"],"answer":1,"explanation":"Le chat dort. Changeons le temps : demain, le chat dormira. Tu entends ? Dort est devenu dormira. Le mot qui change est le verbe : dort."},{"q":"Dans « Laura range sa chambre. », quel est le verbe ?","options":["range","chambre","Laura","sa"],"answer":0,"explanation":"Laura range sa chambre. Demain, Laura rangera sa chambre. Range est devenu rangera. C'est le verbe. Pour le trouver, essaie de dire la phrase au futur."},{"q":"Dans « Nous chantons. », quel est le verbe ?","options":["chantons","nous","aucun","chanson"],"answer":0,"explanation":"Nous chantons. Demain, nous chanterons. Chantons devient chanterons. Le mot qui change quand on change le temps est le verbe."},{"q":"« Le chien court. » Au futur, quel mot change ?","options":["court","le","chien","vite"],"answer":0,"explanation":"Le chien court. Demain, le chien courra. Court devient courra. C'est le verbe qui change de forme."},{"q":"Dans « Tu dessines une étoile. », quel est le verbe ?","options":["étoile","dessines","tu","une"],"answer":1,"explanation":"Tu dessines une étoile. Demain, tu dessineras une étoile. Dessines devient dessineras. Le verbe est donc dessines."},{"q":"Dans « Les enfants jouent. », quel est le verbe ?","options":["enfants","jouent","les","vite"],"answer":1,"explanation":"Les enfants jouent. Demain, les enfants joueront. Jouent devient joueront. Voilà comment repérer le verbe."},{"q":"« Elle mange. » Au futur, on dit…","options":["Elle mange.","Elle mangeait.","Elle mangera.","Elle manger."],"answer":2,"explanation":"Elle mange. Demain, elle mangera. Le mot mangera indique une action qui aura lieu plus tard. C'est le futur du verbe manger."},{"q":"Pourquoi changer le temps de la phrase ?","options":["Pour repérer le verbe","Pour changer le sujet","Pour trouver la virgule","Pour compter les lettres"],"answer":0,"explanation":"Le verbe change souvent quand on passe d'aujourd'hui à demain. Par exemple : je chante, demain je chanterai. Le mot qui change est le verbe."},{"q":"Dans « Le facteur apporte une lettre. », quel mot change au futur ?","options":["facteur","apporte","lettre","une"],"answer":1,"explanation":"Demain, le facteur apportera une lettre. Apporte devient apportera : c’est le verbe."},{"q":"Dans « Les grenouilles sautent. », quel est le verbe ?","options":["grenouilles","Les","sautent","vite"],"answer":2,"explanation":"Demain, les grenouilles sauteront. Sautent change avec le temps : c’est le verbe."}]},{"icon":"🪄","name":"Lunettes magiques","intro":"Encadre les verbes avec ne… pas !","questions":[{"q":"« Le chat dort. » À la forme négative :","options":["Le chat ne dort pas.","Le chat dort ne pas.","Ne le chat dort pas.","Le chat pas ne dort."],"answer":0,"explanation":"Le chat dort. Pour mettre la phrase à la forme négative, dis : Le chat ne dort pas. Le mot dort se trouve entre ne et pas. C'est le verbe."},{"q":"Dans « Léo ne court pas. », le verbe est…","options":["court","Léo","pas","ne"],"answer":0,"explanation":"Léo ne court pas. Regarde entre ne et pas : tu trouves court. Ce mot est le verbe. Les deux petits mots servent de lunettes pour le repérer."},{"q":"« Elle chante. » À la forme négative :","options":["Elle pas chante ne.","Elle chante ne pas.","Elle ne chante pas.","Elle ne pas chante."],"answer":2,"explanation":"Elle chante. Pour dire le contraire, dis : Elle ne chante pas. Ne et pas entourent chante. C'est le verbe."},{"q":"Dans « Nous ne jouons pas. », le verbe est…","options":["pas","nous","jouons","ne"],"answer":2,"explanation":"Nous ne jouons pas. Cherche les deux lunettes : ne et pas. Entre les deux, il y a jouons. C'est le verbe."},{"q":"« Il aime le chocolat. » À la forme négative :","options":["Il n’aime pas le chocolat.","Il aime ne pas le chocolat.","Il ne aime pas le chocolat.","Il aime pas ne le chocolat."],"answer":0,"explanation":"Il aime le chocolat. À la forme négative : Il n'aime pas le chocolat. Devant aime, qui commence par une voyelle, ne devient n'."},{"q":"Dans « Tu n’écoutes pas. », le verbe est…","options":["tu"," ase reste en suspens.","world":0},{"q":"Dans un dialogue, quel signe précède souvent une nouvelle réplique ?","options":["Le tiret","Le point","La virgule","Les deux-points"],"answer":0,"explanation":"Le tiret signale qu’un personnage prend la parole.","world":1},{"q":"Dans « — Viens ici ! murmure Zoé. », quel est le verbe de dialogue ?","options":["Viens","ici","murmure","Zoé"],"answer":2,"explanation":"Murmure précise comment Zoé parle. C’est le verbe de dialogue.","world":1},{"q":"Quel signe peut entourer les paroles rapportées ?","options":["Les guillemets","Les parenthèses","Les virgules","Les points de suspension"],"answer":0,"explanation":"Les guillemets peuvent ouvrir et fermer des paroles rapportées.","world":1},{"q":"Dans « — À demain ! lance Hugo. », qui parle ?","options":["Hugo","Demain","Personne","Le tiret"],"answer":0,"explanation":"Le verbe lance est suivi de Hugo : c’est lui qui parle.","world":1},{"q":"« Avant-hier, nous étions au parc. » Quand ?","options":["Passé","Présent","Futur","Demain"],"answer":0,"explanation":"Avant-hier, c’était avant aujourd’hui : c’est le passé.","world":2},{"q":"« Ce soir, nous regarderons les étoiles. » Quand ?","options":["Passé","Futur","Présent","Hier"],"answer":1,"explanation":"Ce soir désigne un moment qui n’est pas encore arrivé dans cette phrase.","world":2},{"q":"« En ce moment, Paul prépare son sac. » Quand ?","options":["Futur","Passé","Présent","Demain"],"answer":2,"explanation":"En ce moment signifie maintenant : c’est le présent.","world":2},{"q":"Quel groupe de mots annonce le futur ?","options":["La veille","En ce moment","La semaine prochaine","Avant-hier"],"answer":2,"explanation":"La semaine prochaine n’est pas encore arrivée : c’est le futur.","world":2},{"q":"Dans « Ma sœur construit une cabane. », quel est le verbe ?","options":["sœur","construit","cabane","Ma"],"answer":1,"explanation":"Demain, ma sœur construira une cabane. Construit devient construira.","world":3},{"q":"Dans « Les chevaux galo function notion(i,q){var t=(q.q+' '+q.explanation).toLowerCase();if(i===0)return /virgule|sépar|énumér/.test(t)?'Virgule et listes':/deux.points|annonce une liste|:/.test(t)?'Deux-points':/suspension|inachev|…/.test(t)?'Points de suspension':/interrog|question|\?/.test(t)?'Questions':/exclam|émotion|surprise|attention|!/.test(t)?'Exclamations':'Point final';if(i===1)return /guillemet|«|»/.test(t)?'Guillemets':/tiret|réplique|—/.test(t)?'Tirets et répliques':'Verbes de dialogue';if(i===2)return /futur|demain|prochain|bientôt|plus tard/.test(t)?'Futur':/passé|hier|autrefois|dernière/.test(t)?'Passé':'Présent';if(i===3)return /change|transform|temps|demain|hier/.test(t)?'Changer le temps':'Reconnaître le verbe';return /ne |n’|pas|négation|négative/.test(t)?'Encadrer avec ne…pas':'Reconnaître le verbe'}
function recordDifficulty(i,q,correct){if(i<0)return;var label=notion(i,q);var d=state.difficulties[i]||(state.difficulties[i]={});var item=d[label]||(d[label]={miss:0,success:0});if(correct){item.success++;if(item.miss>0)item.miss=Math.max(0,item.miss-1)}else item.miss++;save()}
function difficultySummary(i){var d=state.difficulties[i]||{};return Object.keys(d).filter(function(k){return d[k].miss>0}).sort(function(a,b){return d[b].miss-d[a].miss}).slice(0,2)}

function shuffleQuestions(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function newWorldQuestions(i){var base=DATA.worlds[i].questions.concat(EXTRA_BANKS[i]);var seen=state.seenQuestions[i]||[];var indexed=base.map(function(q,j){return {q:q,id:j}});var fresh=shuffleQuestions(indexed.filter(function(x){return seen.indexOf(x.id)===-1}));var old=shuffleQuestions(indexed.filter(function(x){return seen.indexOf(x.id)!==-1}));var weaknesses=difficultySummary(i);var priority=function(a,b){return (weaknesses.indexOf(notion(i,b.q))!==-1?1:0)-(weaknesses.indexOf(notion(i,a.q))!==-1?1:0)};fresh.sort(priority);old.sort(priority);var chosen=fresh.concat(old).slice(0,10);state.seenQuestions[i]=seen.concat(chosen.map(function(x){return x.id}));if(state.seenQuestions[i].length>=base.length)state.seenQuestions[i]=chosen.map(function(x){return x.id});save();return shuffleQuestions(chosen.map(function(x){return x.q}))}

var KEY='aventure_francais_ce2_v1';var state={unlocked:0,scores:[null,null,null,null,null],badges:[],exam:null};try{var saved=JSON.parse(localStorage.getItem(KEY));if(saved&&saved.scores&&saved.scores.length===5)state=saved}catch(e){}state.difficulties=Array.isArray(state.difficulties)&&state.difficulties.length===5?state.difficulties:[{},{},{},{},{}];state.seenQuestions=Array.isArray(state.seenQuestions)&&state.seenQuestions.length===5?state.seenQuestions:[[],[],[],[],[]];state.coins=Number.isFinite(state.coins)?state.coins:0;state.avatar=Number.isInteger(state.avatar)?state.avatar:0;state.collection=Array.isArray(state.collection)?state.collection:[];state.totalCorrect=Number.isFinite(state.totalCorrect)?state.totalCorrect:0;state.claimed=Array.isArray(state.claimed)?state.claimed:[];var AVATARS=[['🦊','Flamme'],['🐉','Drako'],['🦄','Luna'],['🤖','Bip'],['🐼','Panda']];var ITEMS=[['🗡️','Épée des mots',12],['🛡️','Bouclier du savoir',18],['👑','Couronne royale',25],['🪄','Baguette étoilée',15],['🐲','Dragon doré',30],['🚀','Fusée arc-en-ciel',22],['💎','Diamant légendaire',40],['🏆','Coupe du champion',50]];var currentMini='';var mode='home',wi=0,qi=0,score=0,selected=-1,answers=[],examDone=false;var app=document.getElementById('app');function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}function el(s){app.innerHTML=s;window.scrollTo(0,0)}function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}function burst(){var c=document.getElementById('confetti');c.innerHTML='';for(var i=0;i<24;i++){var d=document.createElement('span');d.className='conf';d.textContent=['⭐','✨','🎉','🌟'][i%4];d.style.left=(Math.random()*95)+'%';d.style.animationDelay=(Math.random()*.6)+'s';c.appendChild(d)}setTimeout(function(){c.innerHTML=''},2700)}

var VOICE_KEY='ce2_voice_settings_v5';
var voicePrefs={enabled:true,automatic:true,congrats:true,rate:0.9};
try{var oldVoice=JSON.parse(localStorage.getItem(VOICE_KEY)||'null');if(oldVoice){Object.keys(voicePrefs).forEach(function(k){if(typeof oldVoice[k]===typeof voicePrefs[k])voicePrefs[k]=oldVoice[k]})}}catch(e){}
var lastSpoken='';var voiceSeq=0;
function voiceSupported(){return 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window}
function stopVoice(){voiceSeq++;if(voiceSupported())try{speechSynthesis.cancel()}catch(e){}}
function frenchVoice(){if(!voiceSupported())return null;var voices=speechSynthesis.getVoices();return voices.find(function(v){return /^fr[-_](FR|CA|BE|CH)/i.test(v.lang)&&v.localService})||voices.find(function(v){return /^fr/i.test(v.lang)})||null}
function say(t,force){if(!voicePrefs.enabled||!voiceSupported()||!t)return;if(!force&&!voicePrefs.automatic)return;lastSpoken=t;stopVoice();var id=voiceSeq;try{var u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=voicePrefs.rate;u.pitch=1.05;var v=frenchVoice();if(v)u.voice=v;u.onerror=function(){if(id===voiceSeq){var info=document.getElementById('voiceStatus');if(info)info.textContent='La lecture vocale est indisponible sur cet appareil.'}};speechSynthesis.speak(u)}catch(e){}}
function repeatVoice(){if(lastSpoken)say(lastSpoken,true)}

function voiceSettings(){stopVoice();mode='voiceSettings';var s=hud()+'<div class="panel"><h2>🔊 Réglages de la voix</h2><p>Une voix française peut lire les explications et féliciter ton héros.</p><label class="setting"><input type="checkbox" id="vEnabled" '+(voicePrefs.enabled?'checked':'')+' onchange="setVoicePref(\'enabled\',this.checked)"> Activer la voix</label><label class="setting"><input type="checkbox" id="vAuto" '+(voicePrefs.automatic?'checked':'')+' onchange="setVoicePref(\'automatic\',this.checked)"> Lire automatiquement les explications</label><label class="setting"><input type="checkbox" id="vCongrats" '+(voicePrefs.congrats?'checked':'')+' onchange="setVoicePref(\'congrats\',this.checked)"> Félicitations vocales</label><label class="setting">Vitesse : <strong id="speedValue">'+voicePrefs.rate.toFixed(1)+'</strong><input style="width:100%" aria-label="Vitesse de lecture" type="range" min="0.7" max="1.2" step="0.1" value="'+voicePrefs.rate+'" oninput="setVoicePref(\'rate\',Number(this.value));document.getElementById(\'speedValue\').textContent=Number(this.value).toFixed(1)"></label><button class="btn blue full" onclick="say(\'Bonjour ! Je suis ton compagnon de révision. Ensemble, nous allons réussir !\',true)">▶️ Tester la voix</button><p id="voiceStatus" class="muted">'+(voiceSupported()?'La voix dépend des voix françaises disponibles sur cet appareil.':'Ce navigateur ne propose pas la synthèse vocale.')+'</p><button class="btn full" onclick="home()">🏠 Retour à la carte</button></div>';el(s)}

<style id="v25-world-panel-fix">
/* V25: placé APRÈS les styles V23 pour corriger la cascade CSS. */
body.v22-world #app > .panel,
body.v22-world #app .panel {
  background:transparent!important;
  background-image:none!important;
  backdrop-filter:none!important;
  -webkit-backdrop-filter:none!important;
  border:0!important;
  border-radius:0!important;
  box-shadow:none!important;
  padding:8px 0 24px!important;
  margin:0!important;
  overflow:visible!important;
}
body.v22-world #app .panel::before,
body.v22-world #app .panel::after {content:none!important;display:none!important}
body.v22-world main,body.v22-world #app {background:transparent!important}
body.v22-world .v22-landmark,
body.v22-world .v20-mission,
body.v22-world .v20-boss,
body.v22-world .v20-guide,
body.v22-world .question,
body.v22-world .option {backdrop-filter:none!important}
body.v22-world .hud {background:rgba(27,48,81,.92)!important}
body.v22-world {background-attachment:fixed!important;background-size:cover!important;background-position:center center!important;background-repeat:no-repeat!important}
@media(max-width:520px){
body.v22-world #app .panel {padding:5px 0 22px!important}
body.v22-world main {padding:8px 12px 45px!important}
}
</style>
<style id="v26-living-worlds">
#v26-ambient{position:fixed;inset:0;z-index:3;pointer-events:none;overflow:hidden;contain:layout style;display:none}
body.v22-world #v26-ambient{display:block}
#v26-ambient .v26-creature{position:absolute;pointer-events:auto;cursor:pointer;touch-action:manipulation;filter:drop-shadow(0 3px 3px #142b3455);will-change:transform;user-select:none;-webkit-tap-highlight-color:transparent}
#v26-ambient svg{width:100%;height:100%;display:block;overflow:visible}
.v26-butterfly{width:58px;height:52px;top:var(--fly-y,22%);left:-70px;animation:v26-fly 8s linear forwards}
.v26-butterfly .wings{transform-origin:50% 50%;animation:v26-flap .42s ease-in-out infinite alternate}
@keyframes v26-fly{0%{transform:translate3d(-10vw,0,0) rotate(-7deg)}25%{transform:translate3d(30vw,-32px,0) rotate(9deg)}50%{transform:translate3d(60vw,16px,0) rotate(-6deg)}75%{transform:translate3d(90vw,-24px,0) rotate(6deg)}100%{transform:translate3d(125vw,4px,0)}}
@keyframes v26-flap{to{transform:scaleX(.28)}}
.v26-mole{width:84px;height:96px;bottom:-98px;left:var(--mole-x,75%);animation:v26-pop 6s ease-in-out forwards}
@keyframes v26-pop{0%,10%,90%,100%{transform:translateY(0)}26%,70%{transform:translateY(-92px)}}
.v26-leaf{width:36px;height:36px;top:-50px;left:var(--leaf-x,25%);animation:v26-leaf 8s ease-in-out forwards}
@keyframes v26-leaf{to{transform:translate3d(45px,110vh,0) rotate(420deg)}}
.v26-stage{width:64px;height:64px;left:-80px;top:var(--fly-y,24%);animation:v26-fly 8s linear forwards}
.v26-clock{width:68px;height:68px;right:6px;top:var(--fly-y,30%);animation:v26-spin 9s linear forwards}
@keyframes v26-spin{to{transform:rotate(360deg)}}
.v26-bat{width:70px;height:56px;top:var(--fly-y,20%);left:-80px;animation:v26-fly 8s linear forwards}
.v26-bubble{width:45px;height:45px;left:var(--mole-x,50%);bottom:-60px;animation:v26-bubble 7s ease-out forwards}
@keyframes v26-bubble{to{transform:translate3d(35px,-105vh,0) scale(.6);opacity:0}}
.v26-spark{position:fixed;z-index:30;pointer-events:none;font-size:22px;animation:v26-spark 900ms ease-out forwards}
@keyframes v26-spark{to{transform:translateY(-48px) scale(1.6);opacity:0}}
@media(prefers-reduced-motion:reduce){#v26-ambient{display:none!important}}
</style>
<style id="v27-more-life">
/* Événements variés, au bord de l'écran et derrière les cartes */
#v26-ambient{z-index:2;pointer-events:none}
#v26-ambient .v26-creature{pointer-events:auto}
.v27-visitor{position:absolute;pointer-events:auto;cursor:pointer;user-select:none;touch-action:manipulation;filter:drop-shadow(0 3px 4px #152a3650);animation-fill-mode:both;will-change:transform,opacity}
.v27-visitor svg{width:100%;height:100%}
.v27-fly{left:-85px;top:var(--y);width:var(--sz,60px);height:var(--sz,60px);animation:v27-cross var(--dur,9s) linear both}
.v27-reverse{left:auto;right:-85px;animation-name:v27-back}
.v27-pop{bottom:-95px;left:var(--x);width:85px;height:95px;animation:v27-peek 6.4s ease-in-out both}
.v27-rise{bottom:-65px;left:var(--x);width:var(--sz,42px);height:var(--sz,42px);animation:v27-rise var(--dur,9s) ease-in-out both}
.v27-fall{top:-65px;left:var(--x);width:var(--sz,35px);height:var(--sz,35px);animation:v27-fall var(--dur,9s) ease-in-out both}
.v27-float{right:var(--x);top:var(--y);width:var(--sz,54px);height:var(--sz,54px);animation:v27-float var(--dur,8s) ease-in-out both}
@keyframes v27-cross{0%{transform:translate3d(0,12px,0) rotate(-8deg);opacity:0}8%{opacity:1}30%{transform:translate3d(36vw,-25px,0) rotate(7deg)}60%{transform:translate3d(75vw,17px,0) rotate(-7deg)}92%{opacity:1}100%{transform:translate3d(125vw,-8px,0);opacity:0}}
@keyframes v27-back{0%{transform:translate3d(0,8px,0) scaleX(-1);opacity:0}8%{opacity:1}40%{transform:translate3d(-53vw,-22px,0) scaleX(-1)}90%{opacity:1}100%{transform:translate3d(-125vw,13px,0) scaleX(-1);opacity:0}}
@keyframes v27-peek{0%,8%,91%,100%{transform:translateY(0)}22%,75%{transform:translateY(-92px)}50%{transform:translateY(-85px) rotate(5deg)}}
@keyframes v27-rise{0%{transform:translateY(0) scale(.75);opacity:0}12%{opacity:.95}65%{opacity:.95}100%{transform:translate3d(25px,-105vh,0) scale(1.12);opacity:0}}
@keyframes v27-fall{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.9}90%{opacity:.9}100%{transform:translate3d(65px,110vh,0) rotate(480deg);opacity:0}}
@keyframes v27-float{0%,100%{transform:translateY(0) scale(.8);opacity:0}15%,80%{opacity:.9}50%{transform:translateY(-24px) scale(1.08)}}
.v27-flap{transform-origin:center;animation:v26-flap .32s ease-in-out infinite alternate}
@media(prefers-reduced-motion:reduce){#v26-ambient{display:none!important}}
</style>
<style id="v28-forest-fauna">

@keyframes v28-perch{0%{transform:translate3d(-90px,-25px,0);opacity:0}20%{transform:translate3d(24vw,0,0);opacity:1}35%,70%{transform:translate3d(28vw,0,0);opacity:1}100%{transform:translate3d(115vw,-60px,0);opacity:0}}

.v28-scurry{position:absolute;left:0;bottom:var(--bottom,4%);width:var(--sz,72px);height:var(--sz,72px);animation:v28-scurry var(--dur,10s) linear both}
.v28-climb{position:absolute;left:var(--x,12%);bottom:0;width:var(--sz,70px);height:var(--sz,70px);animation:v28-climb var(--dur,11s) ease-in-out both}
.v28-perch{position:absolute;left:0;top:var(--y,19%);width:var(--sz,65px);height:var(--sz,65px);animation:v28-perch var(--dur,10s) ease-in-out both}

@media(prefers-reduced-motion:reduce){.v28-hop,.v28-scurry,.v28-climb,.v28-perch,.v28-peekside{animation:none!important;display:none!important}}
</style>

let label='';try{label=AVATARS[state.avatar][1]}catch(e){}s.querySelector('#v57-hero-caption').textContent=label?'Ton compagnon : '+label:'';
map.querySelectorAll('.world').forEach((w,i)=>w.style.setProperty('--idx',i));
}
function curtain(worldIndex,go){if(reduced){go();return}const overlay=document.createElement('div');overlay.className='v57-curtain';overlay.setAttribute('aria-hidden','true');const world=typeof DATA!=='undefined'&&DATA.worlds&&DATA.worlds[worldIndex];overlay.innerHTML='<div class="v57-portal"><b>'+(world?world.icon:'✨')+'</b></div><div class="v57-curtain-title">'+(world?world.name:'En route vers l’aventure')+'</div>';document.body.appendChild(overlay);requestAnimationFrame(()=>overlay.classList.add('active'));setTimeout(()=>{try{go()}finally{setTimeout(()=>{overlay.classList.remove('active');setTimeout(()=>overlay.remove(),330)},270)}},900)}
function burst(){if(reduced)return;const layer=document.createElement('div');layer.className='v57-burst';for(let i=0;i<18;i++){const part=document.createElement('i');part.textContent=['✦','✧','⭐','✨'][i%4];part.style.setProperty('--x',(12+(i*43)%76)+'%');part.style.setProperty('--y',(24+(i*31)%48)+'%');part.style.setProperty('--dx',((i*47)%220-110)+'px');part.style.setProperty('--dy',(-55-(i*23)%170)+'px');part.style.setProperty('--d',(i%5*.04)+'s');part.style.setProperty('--size',(16+i%4*6)+'px');layer.appendChild(part)}document.body.appendChild(layer);setTimeout(()=>layer.remove(),1500)}
let oldHome=home;home=function(){oldHome();stage()};if(typeof mode!=='undefined'&&mode==='home')stage();
let oldStart=startWorld;startWorld=function(i){if(document.querySelector('.v57-curtain'))return;curtain(i,()=>oldStart(i))};
let oldChoose=choose;choose=function(n){let q=null;try{q=(mode==='exam'?examSession:worldSession)[qi]}catch(e){}const correct=q&&Number(n)===Number(q.answer);oldChoose(n);if(correct)burst()};
})();
